name: Generate GIFs

on:
  push:
    branches:
      - master
    paths:
      - "demo/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gifs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gifs:
    name: Render demo GIFs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Render demo GIFs
        run: nix develop .#demo -c bash demo/generate.sh

      - name: Upload rendered GIFs
        uses: actions/upload-artifact@v7
        with:
          name: demo-gifs
          path: media/demo-*.gif
          if-no-files-found: error
