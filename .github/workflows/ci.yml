name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install pip dependencies
        run: pip install -r requirements.txt

      - name: Smoke test with pip dependencies
        run: |
          python agent.py --version
          python agent.py --help > /dev/null
          python -c "from pathlib import Path; assert Path('config/prompts/init.md').is_file()"

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Lint with the flake-pinned ruff
        run: nix develop -c ruff check .

      - name: Smoke test in the dev shell
        run: nix develop -c python agent.py --version
